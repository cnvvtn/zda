# 文件说明：app/config.yml，维护 Python 后端运行时配置示例。
app:
  host: 0.0.0.0
  port: 5000
  database_url: mysql+pymysql://zda_user:zda_password@127.0.0.1:3306/zda?charset=utf8mb4
  environment: development

mqtt:
  host: 127.0.0.1
  port: 1883
  username: ""
  password: ""
  topic_prefix: zda/discussion
  topic_secret: replace-with-random-topic-secret
  client_id_prefix: zda-backend

uvicorn:
  workers: 1
  backlog: 2048
  limit_concurrency: 1000
  timeout_keep_alive: 15
  max_requests: 10000

dynamic_view_schedule:
  enabled: true
  interval_seconds: 60
  scene_count_min: 8

zpay:
  enabled: false
  pid: "replace-with-zpay-pid"
  gateway: https://example.com/
  public_api_base_url: https://example.com
  notify_lock_timeout_seconds: 5
  order_ttl_minutes: 30
  rate_limit:
    order_ip_per_minute: 10
    order_identity_per_minute: 3
    notify_ip_per_minute: 240
  plan_catalog:
    experience:
      name: 轻量补给
      money: "5.00"
      days: 1
      credit_total: 160
      model_level: experience
      priority_level: 1

credit_billing:
  free_daily_credits: 50
  model_costs:
    experience: 10
    basic: 20
    advanced: 50
    top: 100

email_auth:
  enabled: false
  smtp_host: smtp.example.com
  smtp_port: 465
  smtp_ssl: true
  username: noreply@example.com
  from_email: noreply@example.com
  from_name: 知搭 ZDA
  code_ttl_minutes: 10
  session_ttl_days: 30
  rate_limit:
    send_ip_per_minute: 5
    send_email_per_hour: 6
    verify_email_per_minute: 5

llm:
  task_flow_version: 2
